# Main Entry Point - Redirige a la vista principal de Trackers
nextgen_trackers_base:
    path: /trackers/
    defaults: { _controller: nextgen.trackers.controller:display, page: viewtracker }
    methods: [GET]

# Download Handler - Maneja la descarga segura de adjuntos
# Esta ruta debe ir ANTES de la genérica para evitar conflictos
nextgen_trackers_download:
    path: /trackers/download/{attach_id}
    defaults: { _controller: nextgen.trackers.controller:download }
    methods: [GET]
    requirements:
        attach_id: '\d+'

# Generic Controller Access - Maneja todas las páginas (posting, viewticket, viewproject, etc.)
nextgen_trackers_controller:
    path: /trackers/{page}
    defaults: { _controller: nextgen.trackers.controller:display }
    methods: [GET, POST]