{% include 'overall_header.html' %}
<br>
<form id="confirm" action="{{ S_CONFIRM_ACTION }}" method="post">

<div class="panel">
	<div class="inner">
		<div class="content">
			<h2 class="message-title">{{ lang('MOVE_TICKET') }}</h2>
			<p>{{ lang('MOVE_TICKET_CONFIRM') }}</p>

			<fieldset class="fields1">
				<dl>
					<dt><label for="new_project">{{ lang('SELECT_DESTINATION_PROJECT') }}{{ lang('COLON') }}</label></dt>
					<dd>
						<select name="new_project" id="new_project">
							{% for project in projects %}
								<option value="{{ project.ID }}">{{ project.NAME }}</option>
							{% endfor %}
						</select>
					</dd>
				</dl>
			</fieldset>

			<fieldset class="submit-buttons">
				{{ S_HIDDEN_FIELDS }}
				<input type="submit" name="confirm" value="{{ lang('YES') }}" class="button1" />&nbsp;
				<input type="submit" name="cancel" value="{{ lang('NO') }}" class="button2" />
				{{ S_FORM_TOKEN }}
			</fieldset>
		</div>
	</div>
</div>

</form>
<br>
{% include 'overall_footer.html' %}
